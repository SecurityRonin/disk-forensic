name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Retained for the repo-specific jobs BELOW `ci:` only — a called workflow does
# not inherit the caller's `env:`, so this block governs nothing in `ci:`. The
# old ci.yml ran the coverage/package/geiger/umbrella jobs under `-D warnings`;
# dropping it here would quietly relax them.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@9234e1fa9f85b14a8d6fddc7a8f7378f7e30b183
    with:
      # The old MSRV job ran `cargo test --all-features --locked` at 1.93, not a
      # build. `build` (the input default) would verify strictly less than what
      # this repo already promised, so the check is pinned to `test`.
      msrv-check: test
      # The old coverage job gated on FUNCTIONS (`--fail-under-functions 100`),
      # which no input here can express — a line gate is a different assertion.
      # It is preserved verbatim as the `coverage` job below; turning the shared
      # one off keeps that the single coverage gate, exactly as before.
      coverage-gate: "off"

  # ---------------------------------------------------------------------------
  # Copied VERBATIM from the pre-adoption ci.yml. Each expresses something the
  # shared workflow has no input for.
  # ---------------------------------------------------------------------------

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2 # renovate: pin digest
        with:
          tool: cargo-llvm-cov
      # Every function across the library AND the CLI binary must be covered.
      # Line % reads below 100 where reader-generic code is monomorphized per
      # reader type — the function gate is the meaningful invariant.
      - run: cargo llvm-cov --all-features --fail-under-functions 100 --show-missing-lines

  # crates.io only gates description + license fields, not the README/LICENSE
  # files — assert every publishable crate actually packages both.
  package:
    name: Package completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: README + LICENSE packaged in every published crate
        run: |
          set -euo pipefail
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;[print(p['name']) for p in json.load(sys.stdin)['packages'] if p.get('publish') != []]")
          for p in $pkgs; do
            list=$(cargo package -p "$p" --list)
            echo "$list" | grep -qx 'README.md' || { echo "::error::$p does not package README.md"; exit 1; }
            echo "$list" | grep -q '^LICENSE'   || { echo "::error::$p does not package a LICENSE file"; exit 1; }
            echo "✓ $p packages README.md + LICENSE"
          done

  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
        with:
          cache-on-failure: true
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true

  umbrella-map:
    name: Umbrella map integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # (1) the architecture diagram must be valid SVG — a corrupt diagram whose path
      # resolves would still pass mkdocs --strict, so validate it parses.
      - name: Architecture SVG is well-formed
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('docs/assets/umbrella-architecture.svg'); print('svg ok')"
      # (2) every umbrella member listed in the manifest MUST be registered in the
      # inventory — turns "please keep the map current" into a hard gate. (Manifest
      # completeness vs the whole fleet is enforced locally by scripts/umbrella-sweep.sh,
      # which needs the sibling repos and so runs pre-publish, not in single-repo CI.)
      - name: Every manifest member is registered in the inventory
        run: |
          fail=0
          while IFS= read -r line; do
            repo="${line%%#*}"; repo="$(echo "$repo" | tr -d '[:space:]')"
            [ -z "$repo" ] && continue
            grep -q "$repo" docs/validation-inventory.md \
              || { echo "::error::umbrella member '$repo' is not registered in docs/validation-inventory.md"; fail=1; }
          done < docs/umbrella-members.txt
          [ "$fail" -eq 0 ] && echo "All manifest members registered in the inventory."
          exit $fail
