<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="820" fill="#020617"/>
  <rect width="1000" height="820" fill="url(#grid)"/>

  <!-- title -->
  <text x="500" y="38" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">disk-forensic umbrella — the read path</text>
  <text x="500" y="60" fill="#64748b" font-size="11" text-anchor="middle">raw evidence descends through four decode layers into one unified filesystem view</text>

  <!-- pipeline arrows (drawn first, behind boxes) -->
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="500" y1="88"  x2="500" y2="112"/>
    <line x1="500" y1="196" x2="500" y2="220"/>
    <line x1="500" y1="300" x2="500" y2="324"/>
    <line x1="500" y1="420" x2="500" y2="444"/>
    <line x1="500" y1="560" x2="500" y2="584"/>
    <line x1="500" y1="648" x2="500" y2="672"/>
  </g>

  <!-- source -->
  <rect x="330" y="70" width="340" height="18" rx="4" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1"/>
  <text x="500" y="83" fill="#94a3b8" font-size="10" text-anchor="middle">raw evidence — disk image file / block device</text>

  <!-- CONTAINER -->
  <rect x="150" y="112" width="700" height="84" rx="6" fill="#0f172a"/>
  <rect x="150" y="112" width="700" height="84" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="168" y="134" fill="#fbbf24" font-size="12" font-weight="700">CONTAINER</text>
  <text x="168" y="149" fill="#94a3b8" font-size="9">decode → raw sector stream</text>
  <text x="168" y="174" fill="#e2e8f0" font-size="11">ewf · vmdk · vhdx · vhd · qcow2 · aff4 · dmg · ad1 · iso9660</text>
  <text x="832" y="134" fill="#fbbf24" font-size="9" text-anchor="end" opacity="0.7">[P] navigate by sector</text>

  <!-- PARTITION -->
  <rect x="150" y="220" width="700" height="80" rx="6" fill="#0f172a"/>
  <rect x="150" y="220" width="700" height="80" rx="6" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="168" y="242" fill="#cbd5e1" font-size="12" font-weight="700">PARTITION SCHEME</text>
  <text x="168" y="257" fill="#94a3b8" font-size="9">locate volume ranges within the sector stream</text>
  <text x="168" y="282" fill="#e2e8f0" font-size="11">mbr · gpt · apm</text>

  <!-- CRYPTO / FDE -->
  <rect x="150" y="324" width="700" height="96" rx="6" fill="#0f172a"/>
  <rect x="150" y="324" width="700" height="96" rx="6" fill="rgba(136,19,55,0.38)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="168" y="346" fill="#fb7185" font-size="12" font-weight="700">CRYPTO / FULL-DISK ENCRYPTION</text>
  <text x="168" y="361" fill="#94a3b8" font-size="9">unlock (key / passphrase / recovery) → cleartext volume · optional layer</text>
  <text x="168" y="386" fill="#e2e8f0" font-size="11">luks · veracrypt · bitlocker · filevault</text>
  <text x="168" y="406" fill="#fca5a5" font-size="9">AES-XTS / CBC · Elephant diffuser · CoreStorage · dm-crypt</text>

  <!-- FILESYSTEM -->
  <rect x="150" y="444" width="700" height="116" rx="6" fill="#0f172a"/>
  <rect x="150" y="444" width="700" height="116" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="168" y="466" fill="#34d399" font-size="12" font-weight="700">FILESYSTEM</text>
  <text x="168" y="481" fill="#94a3b8" font-size="9">navigate name → inode → block addresses → file bytes</text>
  <text x="168" y="507" fill="#e2e8f0" font-size="11">ntfs · ext4fs · apfs · hfsplus · fat · udf</text>
  <text x="168" y="529" fill="#6ee7b7" font-size="11" font-weight="600">xfs · btrfs · zfs · ufs · refs</text>
  <text x="168" y="546" fill="#34d399" font-size="9" opacity="0.85">↑ published v0.1.0 — reader (-core) + graded auditor (-forensic)</text>
  <text x="832" y="466" fill="#34d399" font-size="9" text-anchor="end" opacity="0.7">[P] navigate by path</text>

  <!-- forensic-vfs -->
  <rect x="150" y="584" width="700" height="64" rx="6" fill="#0f172a"/>
  <rect x="150" y="584" width="700" height="64" rx="6" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="168" y="606" fill="#a78bfa" font-size="12" font-weight="700">forensic-vfs</text>
  <text x="168" y="621" fill="#94a3b8" font-size="9">zero-dep KNOWLEDGE leaf — one read-only FileSystem trait every reader implements</text>
  <text x="168" y="639" fill="#c4b5fd" font-size="9">Arc&lt;dyn FileSystem&gt; · ImageSource · FileId · byte-source agnostic</text>

  <!-- ORCHESTRATION -->
  <rect x="150" y="672" width="340" height="72" rx="6" fill="#0f172a"/>
  <rect x="150" y="672" width="340" height="72" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="320" y="700" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">disk-forensic</text>
  <text x="320" y="717" fill="#94a3b8" font-size="9" text-anchor="middle">orchestrator — wires all four layers,</text>
  <text x="320" y="731" fill="#94a3b8" font-size="9" text-anchor="middle">normalizes to forensicnomicon::report</text>

  <rect x="510" y="672" width="340" height="72" rx="6" fill="#0f172a"/>
  <rect x="510" y="672" width="340" height="72" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="680" y="700" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">4n6mount</text>
  <text x="680" y="717" fill="#94a3b8" font-size="9" text-anchor="middle">FUSE bridge — exposes any</text>
  <text x="680" y="731" fill="#94a3b8" font-size="9" text-anchor="middle">container+FS pair as a normal path</text>

  <!-- side arrows from forensic-vfs to both orchestrators -->
  <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.8">
    <path d="M 400 648 L 320 672" fill="none"/>
    <path d="M 600 648 L 680 672" fill="none"/>
  </g>

  <!-- legend -->
  <text x="150" y="778" fill="#475569" font-size="9">Layer colour = concern: amber container · slate partition · rose crypto · emerald filesystem · violet vfs-leaf · cyan orchestration</text>
  <text x="150" y="794" fill="#475569" font-size="9">Each reader ships a `-core` reader + `-forensic` graded auditor; validation provenance indexed in this document.</text>
</svg>
