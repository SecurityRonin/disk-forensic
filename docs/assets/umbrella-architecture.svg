<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#020617"/>
  <rect width="1000" height="780" fill="url(#grid)"/>

  <text x="500" y="34" fill="#e2e8f0" font-size="19" font-weight="700" text-anchor="middle">disk-forensic umbrella on forensic-vfs</text>
  <text x="500" y="55" fill="#64748b" font-size="11" text-anchor="middle">two entry paths — a physical disk stack and logical archives — converge at one engine</text>

  <!-- source -->
  <rect x="330" y="68" width="340" height="20" rx="4" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1"/>
  <text x="500" y="82" fill="#94a3b8" font-size="10" text-anchor="middle">evidence — disk image · archive · logical image</text>

  <!-- entry arrows: source → both columns -->
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 430 88 Q 300 100 300 116" fill="none"/>
    <path d="M 570 88 Q 725 100 725 116" fill="none"/>
  </g>
  <text x="300" y="106" fill="#475569" font-size="8" text-anchor="middle">physical</text>
  <text x="735" y="106" fill="#475569" font-size="8" text-anchor="middle">logical</text>

  <!-- inner pipeline arrows (left column) -->
  <g stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)">
    <line x1="300" y1="190" x2="300" y2="202"/>
    <line x1="300" y1="262" x2="300" y2="274"/>
    <line x1="300" y1="358" x2="300" y2="370"/>
  </g>
  <!-- converge arrows to engine -->
  <g stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M 300 462 Q 340 478 400 490" fill="none"/>
    <path d="M 725 462 Q 660 478 600 490" fill="none"/>
  </g>

  <!-- LEFT COLUMN — physical disk stack -->
  <!-- CONTAINER -->
  <rect x="90" y="116" width="420" height="74" rx="6" fill="#0f172a"/>
  <rect x="90" y="116" width="420" height="74" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="106" y="137" fill="#fbbf24" font-size="11" font-weight="700">CONTAINER</text>
  <text x="494" y="137" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="end">→ ImageSource</text>
  <text x="106" y="151" fill="#94a3b8" font-size="8">positioned-read byte source</text>
  <text x="106" y="174" fill="#e2e8f0" font-size="10">ewf · qcow2 · vmdk · vhdx · dmg · vhd · aff4 · raw/dd</text>

  <!-- PARTITION -->
  <rect x="90" y="202" width="420" height="60" rx="6" fill="#0f172a"/>
  <rect x="90" y="202" width="420" height="60" rx="6" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="106" y="223" fill="#cbd5e1" font-size="11" font-weight="700">PARTITION</text>
  <text x="494" y="223" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="end">→ VolumeSystem</text>
  <text x="106" y="248" fill="#e2e8f0" font-size="10">gpt · mbr · apm</text>

  <!-- CRYPTO -->
  <rect x="90" y="274" width="420" height="84" rx="6" fill="#0f172a"/>
  <rect x="90" y="274" width="420" height="84" rx="6" fill="rgba(136,19,55,0.38)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="106" y="295" fill="#fb7185" font-size="11" font-weight="700">CRYPTO / FDE</text>
  <text x="494" y="295" fill="#fb7185" font-size="9" font-weight="700" text-anchor="end">→ CryptoLayer</text>
  <text x="106" y="309" fill="#94a3b8" font-size="8">unlock → cleartext · audited RustCrypto · optional</text>
  <text x="106" y="332" fill="#e2e8f0" font-size="10">bitlocker · luks · filevault · veracrypt</text>
  <text x="106" y="350" fill="#fca5a5" font-size="8">decrypt-validated vs real dfVFS / cryptsetup images</text>

  <!-- FILESYSTEM disk -->
  <rect x="90" y="370" width="420" height="92" rx="6" fill="#0f172a"/>
  <rect x="90" y="370" width="420" height="92" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="106" y="391" fill="#34d399" font-size="11" font-weight="700">FILESYSTEM · disk</text>
  <text x="494" y="391" fill="#34d399" font-size="9" font-weight="700" text-anchor="end">→ FileSystem</text>
  <text x="106" y="405" fill="#94a3b8" font-size="8">name → inode → block addresses → file bytes</text>
  <text x="106" y="429" fill="#e2e8f0" font-size="10">ntfs · ext4 · apfs · hfsplus · fat/exFAT · udf</text>
  <text x="106" y="449" fill="#6ee7b7" font-size="10" font-weight="600">xfs · btrfs · zfs · ufs · refs</text>

  <!-- RIGHT COLUMN — logical archives (parallel entry) -->
  <rect x="540" y="116" width="370" height="346" rx="6" fill="#0f172a"/>
  <rect x="540" y="116" width="370" height="346" rx="6" fill="rgba(6,78,59,0.22)" stroke="#34d399" stroke-width="1.5"/>
  <text x="556" y="137" fill="#34d399" font-size="11" font-weight="700">ARCHIVE / LOGICAL</text>
  <text x="894" y="137" fill="#34d399" font-size="9" font-weight="700" text-anchor="end">→ FileSystem</text>
  <text x="556" y="153" fill="#94a3b8" font-size="8">opened directly as a file tree —</text>
  <text x="556" y="165" fill="#94a3b8" font-size="8">bypasses PARTITION + CRYPTO</text>
  <text x="556" y="196" fill="#e2e8f0" font-size="11">zip · iso9660 · ad1 · dar</text>
  <text x="556" y="216" fill="#64748b" font-size="8">.iso = a logical CD/DVD image; iso9660 is its file tree</text>

  <!-- gap chip -->
  <rect x="556" y="240" width="338" height="60" rx="5" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="566" y="258" fill="#fbbf24" font-size="10" font-weight="700">no fleet crate — engine-only (gap)</text>
  <text x="566" y="276" fill="#fde68a" font-size="11">tar · tar.gz · tar.bz2 · 7z</text>
  <text x="566" y="292" fill="#64748b" font-size="8">Phase D: extract tar-core / 7z-core</text>

  <text x="556" y="322" fill="#94a3b8" font-size="9">codecs (ride inside archives):</text>
  <text x="556" y="340" fill="#cbd5e1" font-size="10">gz · bz2 · xz · zstd · lz4</text>
  <text x="556" y="360" fill="#64748b" font-size="8">not standalone readers — decompression layers</text>
  <text x="556" y="440" fill="#475569" font-size="8">Logical archives are top-level entry points, like</text>
  <text x="556" y="452" fill="#475569" font-size="8">disk containers — not derived from a disk filesystem.</text>

  <!-- ENGINE -->
  <rect x="90" y="490" width="820" height="66" rx="6" fill="#0f172a"/>
  <rect x="90" y="490" width="820" height="66" rx="6" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="500" y="513" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">forensic-vfs — four contracts + engine</text>
  <text x="500" y="530" fill="#c4b5fd" font-size="9" text-anchor="middle">ImageSource · VolumeSystem · CryptoLayer · FileSystem   —   Vfs::open(path) → Evidence</text>
  <text x="500" y="546" fill="#94a3b8" font-size="9" text-anchor="middle">zero-dep KNOWLEDGE contract (published 0.2.0) · one engine composes the four</text>

  <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)">
    <path d="M 300 556 L 250 588" fill="none"/>
    <line x1="500" y1="556" x2="500" y2="588"/>
    <path d="M 700 556 L 750 588" fill="none"/>
  </g>

  <!-- CONSUMERS -->
  <rect x="90" y="588" width="250" height="82" rx="6" fill="#0f172a"/>
  <rect x="90" y="588" width="250" height="82" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="215" y="614" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">issen</text>
  <text x="215" y="632" fill="#94a3b8" font-size="9" text-anchor="middle">triage + super-timeline</text>
  <text x="215" y="646" fill="#94a3b8" font-size="9" text-anchor="middle">cross-artifact correlation</text>

  <rect x="375" y="588" width="250" height="82" rx="6" fill="#0f172a"/>
  <rect x="375" y="588" width="250" height="82" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="500" y="614" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">disk-forensic</text>
  <text x="500" y="632" fill="#94a3b8" font-size="9" text-anchor="middle">findings + report + live-disk</text>
  <text x="500" y="646" fill="#94a3b8" font-size="9" text-anchor="middle">disk4n6 CLI</text>

  <rect x="660" y="588" width="250" height="82" rx="6" fill="#0f172a"/>
  <rect x="660" y="588" width="250" height="82" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="785" y="614" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">4n6mount</text>
  <text x="785" y="632" fill="#94a3b8" font-size="9" text-anchor="middle">FUSE / Dokan mount</text>
  <text x="785" y="646" fill="#94a3b8" font-size="9" text-anchor="middle">via MountFs (inode adapter)</text>

  <text x="90" y="700" fill="#475569" font-size="9">Colour = concern: amber ImageSource · slate VolumeSystem · rose CryptoLayer · emerald FileSystem · violet engine · cyan consumers</text>
  <text x="90" y="716" fill="#475569" font-size="9">Dashed amber = format handled only in the standalone engine, no fleet `*-core` crate yet (a coverage gap to extract).</text>
  <text x="90" y="732" fill="#334155" font-size="8">Regenerated as a disk-forensic pre-publish action — keep in lockstep with the VFS-contract-wiring-status table.</text>
</svg>
