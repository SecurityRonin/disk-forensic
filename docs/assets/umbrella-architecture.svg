<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="1010" fill="#020617"/>
  <rect width="1000" height="1010" fill="url(#grid)"/>

  <text x="500" y="38" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">disk-forensic umbrella on forensic-vfs</text>
  <text x="500" y="60" fill="#64748b" font-size="11" text-anchor="middle">four VFS contracts, one engine, three consumers — dashed = handled only in the engine, no fleet crate yet</text>

  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="500" y1="88"  x2="500" y2="112"/>
    <line x1="500" y1="188" x2="500" y2="212"/>
    <line x1="500" y1="288" x2="500" y2="312"/>
    <line x1="500" y1="408" x2="500" y2="432"/>
    <line x1="500" y1="524" x2="500" y2="548"/>
    <line x1="500" y1="632" x2="500" y2="656"/>
  </g>

  <rect x="330" y="70" width="340" height="18" rx="4" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1"/>
  <text x="500" y="83" fill="#94a3b8" font-size="10" text-anchor="middle">raw evidence — disk image file / block device</text>

  <!-- CONTAINER → ImageSource -->
  <rect x="150" y="112" width="700" height="76" rx="6" fill="#0f172a"/>
  <rect x="150" y="112" width="700" height="76" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="168" y="134" fill="#fbbf24" font-size="12" font-weight="700">CONTAINER</text>
  <text x="832" y="134" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="end">→ ImageSource</text>
  <text x="168" y="149" fill="#94a3b8" font-size="9">positioned-read byte source</text>
  <text x="168" y="173" fill="#e2e8f0" font-size="11">ewf · qcow2 · vmdk · vhdx · dmg · vhd · aff4 · raw/dd</text>

  <!-- PARTITION → VolumeSystem -->
  <rect x="150" y="212" width="700" height="76" rx="6" fill="#0f172a"/>
  <rect x="150" y="212" width="700" height="76" rx="6" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="168" y="234" fill="#cbd5e1" font-size="12" font-weight="700">PARTITION</text>
  <text x="832" y="234" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="end">→ VolumeSystem</text>
  <text x="168" y="249" fill="#94a3b8" font-size="9">locate volume ranges</text>
  <text x="168" y="273" fill="#e2e8f0" font-size="11">gpt · mbr · apm</text>

  <!-- CRYPTO → CryptoLayer -->
  <rect x="150" y="312" width="700" height="96" rx="6" fill="#0f172a"/>
  <rect x="150" y="312" width="700" height="96" rx="6" fill="rgba(136,19,55,0.38)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="168" y="334" fill="#fb7185" font-size="12" font-weight="700">CRYPTO / FDE</text>
  <text x="832" y="334" fill="#fb7185" font-size="10" font-weight="700" text-anchor="end">→ CryptoLayer</text>
  <text x="168" y="349" fill="#94a3b8" font-size="9">unlock → cleartext volume · audited RustCrypto, never hand-rolled · optional layer</text>
  <text x="168" y="374" fill="#e2e8f0" font-size="11">bitlocker · luks · filevault · veracrypt</text>
  <text x="168" y="394" fill="#fca5a5" font-size="9">decrypt-validated vs real dfVFS / cryptsetup images</text>

  <!-- FILESYSTEM (disk) → FileSystem -->
  <rect x="150" y="432" width="700" height="92" rx="6" fill="#0f172a"/>
  <rect x="150" y="432" width="700" height="92" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="168" y="454" fill="#34d399" font-size="12" font-weight="700">FILESYSTEM · disk</text>
  <text x="832" y="454" fill="#34d399" font-size="10" font-weight="700" text-anchor="end">→ FileSystem</text>
  <text x="168" y="469" fill="#94a3b8" font-size="9">navigate name → inode → block addresses → file bytes</text>
  <text x="168" y="494" fill="#e2e8f0" font-size="11">ntfs · ext4 · apfs · hfsplus · fat/exFAT · iso9660 · udf</text>
  <text x="168" y="514" fill="#6ee7b7" font-size="11" font-weight="600">xfs · btrfs · zfs · ufs · refs</text>

  <!-- ARCHIVE / LOGICAL → FileSystem (with engine-only gaps) -->
  <rect x="150" y="548" width="700" height="84" rx="6" fill="#0f172a"/>
  <rect x="150" y="548" width="700" height="84" rx="6" fill="rgba(6,78,59,0.22)" stroke="#34d399" stroke-width="1.5"/>
  <text x="168" y="570" fill="#34d399" font-size="12" font-weight="700">ARCHIVE / LOGICAL</text>
  <text x="832" y="570" fill="#34d399" font-size="10" font-weight="700" text-anchor="end">→ FileSystem</text>
  <text x="168" y="585" fill="#94a3b8" font-size="9">file-tree containers &amp; logical images</text>
  <text x="168" y="609" fill="#e2e8f0" font-size="11">zip · ad1 · dar</text>
  <!-- gap chips: no fleet crate, engine-only -->
  <rect x="290" y="598" width="384" height="18" rx="4" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="611" fill="#fbbf24" font-size="10">tar · tar.gz · tar.bz2 · 7z — no fleet crate (engine-only)</text>
  <text x="168" y="626" fill="#64748b" font-size="9">codecs gz · bz2 · xz · zstd · lz4 ride inside these · Phase D: extract tar-core / 7z-core</text>

  <!-- forensic-vfs engine -->
  <rect x="150" y="656" width="700" height="68" rx="6" fill="#0f172a"/>
  <rect x="150" y="656" width="700" height="68" rx="6" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="500" y="680" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">forensic-vfs — four contracts + engine</text>
  <text x="500" y="697" fill="#c4b5fd" font-size="9" text-anchor="middle">ImageSource · VolumeSystem · CryptoLayer · FileSystem   —   Vfs::open(path) → Evidence</text>
  <text x="500" y="713" fill="#94a3b8" font-size="9" text-anchor="middle">zero-dep KNOWLEDGE contract (published 0.2.0) · one engine composes the four</text>

  <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)">
    <path d="M 300 724 L 270 768" fill="none"/>
    <line x1="500" y1="724" x2="500" y2="768"/>
    <path d="M 700 724 L 730 768" fill="none"/>
  </g>

  <!-- CONSUMERS -->
  <rect x="150" y="768" width="216" height="86" rx="6" fill="#0f172a"/>
  <rect x="150" y="768" width="216" height="86" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="258" y="794" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">issen</text>
  <text x="258" y="812" fill="#94a3b8" font-size="9" text-anchor="middle">triage + super-timeline</text>
  <text x="258" y="826" fill="#94a3b8" font-size="9" text-anchor="middle">cross-artifact correlation</text>

  <rect x="392" y="768" width="216" height="86" rx="6" fill="#0f172a"/>
  <rect x="392" y="768" width="216" height="86" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="500" y="794" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">disk-forensic</text>
  <text x="500" y="812" fill="#94a3b8" font-size="9" text-anchor="middle">findings + report + live-disk</text>
  <text x="500" y="826" fill="#94a3b8" font-size="9" text-anchor="middle">disk4n6 CLI</text>

  <rect x="634" y="768" width="216" height="86" rx="6" fill="#0f172a"/>
  <rect x="634" y="768" width="216" height="86" rx="6" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="742" y="794" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">4n6mount</text>
  <text x="742" y="812" fill="#94a3b8" font-size="9" text-anchor="middle">FUSE / Dokan mount</text>
  <text x="742" y="826" fill="#94a3b8" font-size="9" text-anchor="middle">via MountFs (inode adapter)</text>

  <text x="150" y="890" fill="#475569" font-size="9">Contract colour = concern: amber ImageSource · slate VolumeSystem · rose CryptoLayer · emerald FileSystem · violet engine · cyan consumers</text>
  <text x="150" y="906" fill="#475569" font-size="9">Dashed amber = format handled only in the standalone engine with no fleet `*-core` crate yet (a coverage gap to extract).</text>
  <text x="150" y="922" fill="#334155" font-size="8">Regenerated as a disk-forensic pre-publish action — keep in lockstep with the VFS-contract-wiring-status table.</text>
</svg>
