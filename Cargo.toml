[package]
name = "disk-forensic"
version = "0.11.3"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
authors = ["Albert Hui <albert@securityronin.com>"]
description = "Forensic disk-image orchestrator — decodes E01/VMDK/VHDX/VHD/QCOW2/DMG containers, auto-detects MBR/GPT/APM, and routes ISO 9660 to filesystem analysis"
repository = "https://github.com/SecurityRonin/disk-forensic"
keywords = ["forensics", "partition", "mbr", "gpt"]
categories = ["parser-implementations", "filesystem"]
exclude = ["fuzz/", ".github/", "wix/", "deny.toml", "renovate.json", ".pre-commit-config.yaml"]

[dependencies]
# Bounded integer reads over untrusted image headers (ADR-0012).
safe-read = "0.2"
thiserror = "2"
# Archive-layer peel: transparently unwrap a compression-wrapped image
# (evidence.dd.gz -> dd) before container detection.
archive-core = "0.1"
# Sibling scheme parsers (one per partitioning scheme) and the knowledge base.
# Partition-scheme analyzers (each now a *-partition-forensic workspace with a
# *-partition-core reader).
mbr-partition-forensic = "0.6.1"
gpt-partition-forensic = "0.6.0"
apm-partition-forensic = "0.6.0"
# Filesystem analyzer for optical (ISO 9660) images — disk4n6's FS dimension.
iso9660-forensic = "0.7.0"
forensicnomicon = "1"
# Live-system device enumeration + acquisition-integrity findings (fleet crates).
# The OS-specific FFI lives in livedisk-core, so disk-forensic stays unsafe-free.
livedisk = { version = "0.2.0", package = "livedisk-core" }
livedisk-forensic = "0.2.0"
# Container/image decoders (decode → Read+Seek view of the disk).
ewf = "0.4"
vmdk = { version = "0.8.0", package = "vmdk-core" }
# VMDK forensic analyzer — its analyse() findings aggregate into the report.
vmdk-forensic = "0.8.0"
# Our own QCOW2 reader (replaces third-party `qcow`, which pulled an ancient zstd
# that conflicted across the fleet). Package qcow2-core, imported as `qcow2`.
qcow2 = { version = "0.3.1", package = "qcow2-core" }
vhdx = { version = "0.3.0", package = "vhdx-core" }
# Our own pure-Rust DMG/UDIF reader (replaces third-party `udif`, which pulled
# C-based lzfse/bzip2/lzma). Package dmg-core, imported as `dmg`.
dmg = { version = "0.1.4", package = "dmg-core" }
# AFF4 reader: a physical AFF4 (aff4:ImageStream / aff4:Map) is a Read+Seek disk
# view decoded by container::open; a logical AFF4 (aff4:FileImage) is read via
# the `logical` module. `::aff4` is the reader crate; `aff4` (imported from
# forensicnomicon) is the magic module used for sniffing.
aff4 = "0.2.2"
# AccessData AD1 logical-image reader (FTK "Custom Content Image") — a file tree
# with no raw disk underneath, surfaced through the `logical` module. Package
# ad1-core, imported as `ad1`.
ad1 = { version = "0.1.0", package = "ad1-core" }
# DAR (Denis Corbin Disk ARchiver) logical backup archive — a file tree, read via
# the `logical` module. dar-core, imported as `dar`.
dar = { version = "0.7.0", package = "dar-core" }
serde = { version = "1", features = ["derive"], optional = true }
# JSON output for the `disk-forensic --json` binary (enabled by the serde feature).
serde_json = { version = "1", optional = true }

[features]
default = []
# Serialize the analysis types to JSON, propagating to the scheme parsers.
serde = [
    "dep:serde",
    "dep:serde_json",
    "mbr-partition-forensic/serde",
    "apm-partition-forensic/serde",
    "gpt-partition-forensic/serde",
    "iso9660-forensic/serde",
    "forensicnomicon/serde",
    "livedisk/serde",
    "livedisk-forensic/serde",
]

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# Compress fixtures on the fly for the archive-layer (peel) opener tests.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# AFF4 fixture builder (physical + logical synthetic containers) for the
# container/logical opener tests. `test-helpers` exposes `aff4::testutil`; it is
# a dev-only feature and never compiles into a normal `cargo build`.
aff4 = { version = "0.2.2", features = ["test-helpers"] }
# AD1 fixture builder (`testfix`) — spec-faithful logical trees for the logical
# opener tests. Dev-only; never compiled into a normal build.
ad1 = { version = "0.1.0", package = "ad1-core", features = ["testfix"] }

[lints.rust]
# All OS-specific FFI now lives in livedisk-core; disk-forensic is pure
# orchestration and contains no unsafe code.
unsafe_code = "forbid"

# Debian package (.deb) built by `cargo deb` in the release workflow. The binary
# is `disk4n6` (the crate is `disk-forensic`); cargo-deb rewrites the
# `target/release/` asset path for cross-target builds.
[package.metadata.deb]
maintainer = "SecurityRonin <security-ronin@users.noreply.github.com>"
section = "utils"
priority = "optional"
extended-description = """\
disk4n6 is a forensic disk-image orchestrator and live-device triage tool. \
It decodes E01/VMDK/VHDX/VHD/QCOW2/DMG containers, auto-detects MBR/GPT/APM \
partitioning, routes ISO 9660 to filesystem analysis, and lists the host's \
physical disks and partitions with a proportional partition-layout view and \
acquisition-integrity findings."""
assets = [
    ["target/release/disk4n6", "usr/bin/", "755"],
]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
unwrap_used = "deny"
expect_used = "deny"
# container::open is a flat dispatch over every supported container format;
# splitting it would scatter one readable match across helpers. Allowed fleet-wide.
too_many_lines = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
