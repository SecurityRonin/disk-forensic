[package]
name = "disk-forensic"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Forensic disk-image orchestrator — decodes E01/VMDK/VHDX/VHD/QCOW2/DMG containers, auto-detects MBR/GPT/APM, and routes ISO 9660 to filesystem analysis"
repository = "https://github.com/SecurityRonin/disk-forensic"
keywords = ["forensics", "partition", "mbr", "gpt"]
categories = ["parser-implementations", "filesystem"]
exclude = ["fuzz/", ".github/", "deny.toml", "renovate.json", ".pre-commit-config.yaml"]

[dependencies]
thiserror = "2"
# Sibling scheme parsers (one per partitioning scheme) and the knowledge base.
# Partition-scheme analyzers (each now a *-partition-forensic workspace with a
# *-partition-core reader).
mbr-partition-forensic = "0.5.0"
gpt-partition-forensic = "0.5.0"
apm-partition-forensic = "0.5.0"
# Filesystem analyzer for optical (ISO 9660) images — disk4n6's FS dimension.
iso9660-forensic = "0.6.0"
forensicnomicon = "0.5"
# Container/image decoders (decode → Read+Seek view of the disk).
ewf = "0.2.1"
vmdk = { version = "0.7.0", package = "vmdk-core" }
# VMDK forensic analyzer — its analyse() findings aggregate into the report.
vmdk-forensic = "0.7.0"
# Our own QCOW2 reader (replaces third-party `qcow`, which pulled an ancient zstd
# that conflicted across the fleet). Package qcow2-core, imported as `qcow2`.
qcow2 = { version = "0.2", package = "qcow2-core" }
vhdx = { version = "0.2.0", package = "vhdx-core" }
udif = "0.3.4"
serde = { version = "1", features = ["derive"], optional = true }
# JSON output for the `disk-forensic --json` binary (enabled by the serde feature).
serde_json = { version = "1", optional = true }

[features]
default = []
# Serialize the analysis types to JSON, propagating to the scheme parsers.
serde = [
    "dep:serde",
    "dep:serde_json",
    "mbr-partition-forensic/serde",
    "apm-partition-forensic/serde",
    "gpt-partition-forensic/serde",
    "iso9660-forensic/serde",
    "forensicnomicon/serde",
]

# ── Live-system device enumeration (the `live` module) ───────────────────────
# Discovery of physical disks/partitions on the running host is inherently
# OS-specific. Linux needs nothing (a sysfs file walk); macOS and Windows reach
# the kernel through FFI, isolated to src/live/{macos,windows}.rs.
[target.'cfg(target_os = "macos")'.dependencies]
# IOKit IOMedia registry walk for the device tree; core-foundation gives safe
# wrappers over the CFDictionary/CFString/CFNumber property values.
io-kit-sys = "0.5"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
# DeviceIoControl IOCTLs (drive layout, length, geometry) over \\.\PhysicalDriveN.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.rust]
# `forbid` everywhere except the two platform FFI backends (macOS IOKit, Windows
# DeviceIoControl), which carry a scoped `#[allow(unsafe_code)]` with `// SAFETY:`
# notes on every call. `deny` lets that scoped allow compile while still failing
# any unannotated unsafe in the rest of the crate. Linux + all pure logic remain
# unsafe-free.
unsafe_code = "deny"
